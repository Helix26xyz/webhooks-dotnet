resources:
- job.yaml
- service.yaml

# Generate unique suffix for job name based on configmap content
# When image or config changes, the hash changes, creating a new job
generatorOptions:
  disableNameSuffixHash: false

configMapGenerator:
- name: storagemigrations-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=storageMigrations
    - ASPNETCORE_URLS=http://+:8080;
- name: storagemigrations-version
  literals:
    - IMAGE=ghcr.io/helix26xyz/webhooks-dotnet-storagemigrations:main

