---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: defaultconnection
  labels:
    app: defaultconnection
spec:
  serviceName: defaultconnection
  replicas: 1
  selector:
    matchLabels:
      app: defaultconnection
  template:
    metadata:
      labels:
        app: defaultconnection
    spec:
      containers:
      - name: defaultconnection
        image: mcr.microsoft.com/mssql/server:2022-latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 1433
        envFrom:
        - configMapRef:
            name: defaultconnection-env
        - secretRef:
            name: defaultconnection-secrets
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
      terminationGracePeriodSeconds: 180
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      # Optional: Specify storageClassName if you have a specific storage class
      # storageClassName: standard
